[project]
name = "caloraai"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "aerich>=0.9.2",
    "aiogram>=3.22.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.8",
    "google-genai>=1.0.0",
    "pydantic>=2.11.10",
    "pydantic-settings>=2.11.0",
    "python-multipart>=0.0.9",
    "tortoise-orm>=0.25.4",
    "uvicorn>=0.39.0",
]

[tool.aerich]
tortoise_orm = "config_reader.TORTOISE_ORM"
location = "./db/migrations"
src_folder = "./."
