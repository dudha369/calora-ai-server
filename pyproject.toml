[project]
name = "calora-ai"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "aerich>=0.9.2",
    "aiogram>=3.22.0",
    "apscheduler>=3.11.2",
    "asyncpg>=0.31.0",
    "boto3>=1.42.97",
    "fastapi>=0.128.8",
    "google-genai>=1.0.0",
    "pydantic>=2.11.10",
    "pydantic-settings>=2.11.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "python-multipart>=0.0.9",
    "tortoise-orm>=0.25.4",
    "uvicorn>=0.39.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.aerich]
tortoise_orm = "config.TORTOISE_ORM"
location = "./db/migrations"
src_folder = "./."
